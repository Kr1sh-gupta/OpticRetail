events { 
    worker_connections 1024; 
}

http {
    # Define an upstream block to load balance across all API replicas
    upstream backend_api {
        # Docker's internal DNS automatically resolves 'backend' to all replicas
        server backend:8000;
    }

    server {
        listen 80;

        # Forward all requests to the backend replicas
        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
