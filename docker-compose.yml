version: '3.8'

# Set a custom project name to ensure isolation
name: opticretail-demo

services:
  # ----------------------------------------------------
  # DATABASE LAYER
  # ----------------------------------------------------
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: opticretail_demo_postgres
    environment:
      POSTGRES_USER: optic_user
      POSTGRES_PASSWORD: optic_password
      POSTGRES_DB: optic_db
    # Not mapping ports to host to ensure complete isolation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optic_user -d optic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # BACKEND API LAYER (Load Balanced)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://optic_user:optic_password@db:5432/optic_db
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
    # Ensure Docker restarts containers if they crash
    restart: always

  # ----------------------------------------------------
  # LOAD BALANCER LAYER
  # ----------------------------------------------------
  lb:
    image: nginx:alpine
    container_name: opticretail_demo_lb
    ports:
      - "8000:80" # Exposed to host: Backend API Load Balancer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # ----------------------------------------------------
  # FRONTEND LAYER
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: opticretail_demo_frontend
    ports:
      - "3000:80" # Exposed to host: Frontend UI
    volumes:
      - cctv_videos:/usr/share/nginx/html/videos:ro
    depends_on:
      - backend

  # ----------------------------------------------------
  # COMPUTER VISION PIPELINE SIMULATOR (Edge Layer)
  # ----------------------------------------------------
  pipeline:
    build:
      # Context is the purplle root so the Dockerfile can COPY pipeline/yolov8n.onnx
      context: ..
      dockerfile: demo/pipeline.Dockerfile
    container_name: opticretail_demo_pipeline
    volumes:
      # Named volume for video storage — populated by download_videos.py on first run.
      # ALTERNATIVE: Uncomment the line below to use local videos instead of Drive:
      # - ../CCTV Footage:/app/videos
      - cctv_videos:/app/videos
    environment:
      - API_INGEST_URL=http://lb:80/events/ingest
      - EMIT_BATCH_SIZE=50
      - STORE_ID=STORE_BLR_002
      - CONFIDENCE_THRESHOLD=0.40
      - FRAME_SKIP=5
      # Videos are downloaded to /app/videos/ by download_videos.py
      - CAM1_SOURCE=/app/videos/CAM 1.mp4
      - CAM2_SOURCE=/app/videos/CAM 2.mp4
      - CAM3_SOURCE=/app/videos/CAM 3.mp4
      - CAM4_SOURCE=/app/videos/CAM 4.mp4
      - CAM5_SOURCE=/app/videos/CAM 5.mp4
    depends_on:
      - lb

volumes:
  # Persistent volume so videos survive container restarts (no re-download needed)
  cctv_videos:
